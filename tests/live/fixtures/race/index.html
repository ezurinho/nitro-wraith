<!doctype html>
<html>
<head><meta charset="utf-8"><title>race</title></head>
<body style="margin:0;background:#0b0b0b;min-height:900px">
<div id="app"></div>
<script>
  // Datos sembrados: dos sesiones cerradas (una con comas y comillas en el
  // motivo, para probar el escapado del CSV) y dos dias del historico.
  // `at` y `updatedAt` son relativos a ahora para que el banco no caduque.
  const now = Date.now();
  localStorage.setItem('autoTyperTandaLog', JSON.stringify([
    { at: now - 7200000, races: 12, wpm: 111.234, target: 110.5, acc: 97.12, dq: 0, xp: 1240, reason: 'limit 10 races' },
    { at: now - 3600000, races: 8, wpm: 108.9, target: 110.2, acc: 96.4, dq: 1, xp: 860, reason: 'manual stop, "user" asked' }
  ]));
  localStorage.setItem('ntQueue:dayHist:2026-10-30:seed1', JSON.stringify({
    date: '2026-10-30', races: 10, sumWpm: 1120, sumTarget: 1100, boxes: 1, dq: 0, xp: 1500,
    clean: 5, firstAt: now - 90000000, lastAt: now - 86400000, dqAt: 0, updatedAt: now
  }));
  localStorage.setItem('ntQueue:dayHist:2026-10-31:seed2', JSON.stringify({
    date: '2026-10-31', races: 6, sumWpm: 666, sumTarget: 660, boxes: 0, dq: 2, xp: 900,
    clean: 0, firstAt: now - 47000000, lastAt: now - 43200000, dqAt: now - 44000000, updatedAt: now
  }));
</script>
<script src="/nitro-wraith.user.js"></script>
</body>
</html>
