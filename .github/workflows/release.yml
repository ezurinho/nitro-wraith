name: release

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIST_ID: 88f8b25546f8bb0ea588291bab8ffa58
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the current main commit
        id: current
        run: |
          git fetch origin main --tags --force
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "A newer main commit is already pending; this run will not publish."
          fi

      - name: Configure git
        if: steps.current.outputs.skip != '1'
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"

      - name: Verify release helper and versions
        if: steps.current.outputs.skip != '1'
        run: |
          node --check tools/build.js
          node --check tools/release.js
          node --check tools/readme.js
          node tools/build.js --check
          node tools/readme.js check
          node tools/release.js check

      - name: Prepare release
        id: prepare
        if: steps.current.outputs.skip != '1'
        run: |
          node tools/release.js prepare | tee release.env
          cat release.env >> "$GITHUB_OUTPUT"

      - name: Check Gist access
        id: gist
        if: steps.current.outputs.skip != '1'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::error::GIST_TOKEN is missing. Add a repository secret with gist scope."
            exit 1
          fi
          gist_version="$(GH_TOKEN="$GIST_TOKEN" gh api "gists/$GIST_ID" \
            --jq '.files["nitro-wraith.meta.js"].content' \
            | sed -n 's|^// @version[[:space:]]*||p' | head -n1)"
          echo "GIST_VERSION=$gist_version" >> "$GITHUB_OUTPUT"
          echo "Gist version: ${gist_version:-missing}"

      - name: Decide publication
        id: decision
        if: steps.current.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode="${{ steps.prepare.outputs.MODE }}"
          tag="${{ steps.prepare.outputs.TAG }}"
          version="${{ steps.prepare.outputs.VERSION }}"

          if [ "$mode" = "skip" ]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              mode="repair"
            elif [ "${{ steps.gist.outputs.GIST_VERSION }}" != "$version" ]; then
              mode="sync"
            else
              mode="none"
            fi
          fi

          echo "MODE=$mode" >> "$GITHUB_OUTPUT"
          echo "Publication mode: $mode"

      - name: Commit the patch bump
        if: steps.current.outputs.skip != '1' && steps.decision.outputs.MODE == 'bump'
        run: |
          node --check nitro-wraith.user.js
          node tools/readme.js sync
          node --check tools/readme.js
          node tools/readme.js check
          node tools/release.js check
          git add src nitro-wraith.user.js nitro-wraith.meta.js package.json README.md CHANGELOG.md
          git commit -m "release: ${{ steps.prepare.outputs.VERSION }} [skip ci]"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Update Gist
        if: steps.current.outputs.skip != '1' && steps.decision.outputs.MODE != 'none'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          version="${{ steps.prepare.outputs.VERSION }}"
          # Un solo PATCH para los dos archivos: dos `gh gist edit` seguidos
          # chocan con el bloqueo de escritura del gist (HTTP 409) y lo dejan
          # con el .user.js en una version y el .meta.js en la anterior.
          node -e '
            const fs = require("fs");
            const payload = {
              description: `NITRO WRAITH \u2014 human-paced Nitro Type userscript ${process.argv[1]}`,
              files: {
                "nitro-wraith.user.js": { content: fs.readFileSync("nitro-wraith.user.js", "utf8") },
                "nitro-wraith.meta.js": { content: fs.readFileSync("nitro-wraith.meta.js", "utf8") },
              },
            };
            fs.writeFileSync("gist-patch.json", JSON.stringify(payload));
          ' "$version"
          for attempt in 1 2 3 4; do
            if gh api --method PATCH "gists/$GIST_ID" --input gist-patch.json >/dev/null; then
              echo "Gist updated on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::The Gist rejected the update after four attempts."
          exit 1

      - name: Publish release
        if: >
          steps.current.outputs.skip != '1' &&
          (steps.decision.outputs.MODE == 'publish' ||
           steps.decision.outputs.MODE == 'bump' ||
           steps.decision.outputs.MODE == 'repair')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.prepare.outputs.TAG }}"
          version="${{ steps.prepare.outputs.VERSION }}"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "NITRO WRAITH $version"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" nitro-wraith.user.js nitro-wraith.meta.js --clobber
            gh release edit "$tag" \
              --title "NITRO WRAITH — $version" \
              --notes-file .release-notes.md
          else
            gh release create "$tag" --verify-tag \
              --title "NITRO WRAITH — $version" \
              --notes-file .release-notes.md \
              nitro-wraith.user.js nitro-wraith.meta.js
          fi
