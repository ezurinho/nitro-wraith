name: visual

# La regresion visual compara PNG contra las baselines commiteadas, que se
# capturaron en Windows (win32 10.0.26200). Por eso este job usa windows-latest:
# un runner Linux cambiaria las fuentes y el resultado seria un falso fallo.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'nitro-wraith.user.js'
      - 'nitro-wraith.meta.js'
      - 'tools/visual.js'
      - 'tools/build.js'
      - 'package.json'
      - 'tests/visual/**'
      - 'tests/live/run.js'
      - 'tests/live/panel-read.js'
      - '.github/workflows/visual.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'nitro-wraith.user.js'
      - 'nitro-wraith.meta.js'
      - 'tools/visual.js'
      - 'tools/build.js'
      - 'package.json'
      - 'tests/visual/**'
      - 'tests/live/run.js'
      - 'tests/live/panel-read.js'
      - '.github/workflows/visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Find Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Chrome not found on the runner" }
          "CHROME_PATH=$chrome" >> $env:GITHUB_ENV
          & $chrome --version

      - name: Build the userscript from src
        run: npm run build

      - name: Capture and compare the 15 panel shots
        run: npm run visual

      - name: Upload the visual report and diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nitro-wraith-visual-current
          path: tests/visual/current
          if-no-files-found: ignore
          retention-days: 7
