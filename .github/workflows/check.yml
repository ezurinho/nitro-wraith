name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Find Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Run checks
        run: npm run check

  # The CDP harness only drives Chrome. This job boots the same userscript and
  # fixtures in Firefox and WebKit so an engine-specific regression (shadow DOM,
  # CSS, shortcut handling) fails before a release instead of on a user's browser.
  # It runs inside the official image because `playwright install --with-deps`
  # pulls ~100 apt packages, and a slow archive mirror has stalled the job for
  # the full 20-minute timeout. The image ships the browsers and their libs.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    # Firefox refuses to launch when $HOME is not owned by the user. GitHub
    # mounts /github/home owned by pwuser while the job runs as root.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run the Firefox and WebKit smoke
        run: npm run test:browsers
